# Ambiente canonico do experimento.
#
# Toda compilacao, execucao de testes, verificacao de regras arquiteturais e
# execucao da suite-oraculo deve ocorrer atraves deste ambiente, e nunca
# diretamente na maquina do pesquisador. Isso garante que os resultados de
# "compilou / passou nos testes / violou arquitetura" sejam identicos em
# qualquer maquina e reproduziveis por terceiros.

name: republicas

services:

  # Banco de dados da aplicacao e dos testes de integracao.
  db:
    image: postgres:16.4-alpine
    container_name: republicas-db
    environment:
      POSTGRES_DB: republicas
      POSTGRES_USER: republicas
      POSTGRES_PASSWORD: republicas
      # Locale estavel: evita diferencas de ordenacao entre maquinas.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U republicas -d republicas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Ambiente de build e verificacao do backend.
  # Uso: docker compose run --rm build mvn -B verify
  #
  # Aponta deliberadamente para o banco de testes: as variaveis de ambiente tem
  # precedencia sobre os arquivos de configuracao no Spring Boot, de modo que
  # apontar este servico para o banco da aplicacao faria a suite de testes
  # depender do estado deixado por execucoes anteriores da aplicacao.
  build:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: republicas-build
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/republicas_test
      SPRING_DATASOURCE_USERNAME: republicas
      SPRING_DATASOURCE_PASSWORD: republicas
      # Fuso e locale fixos: garantem que testes sensiveis a data sejam estaveis.
      TZ: America/Sao_Paulo
      MAVEN_OPTS: "-Duser.language=pt -Duser.country=BR"
    volumes:
      - ./:/workspace
      - maven-repo:/root/.m2
    command: ["mvn", "-B", "verify"]

  # Execucao da aplicacao, sobre o banco de dados da aplicacao.
  # Uso: docker compose up app
  app:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: republicas-app
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/republicas
      SPRING_DATASOURCE_USERNAME: republicas
      SPRING_DATASOURCE_PASSWORD: republicas
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
      - maven-repo:/root/.m2
    command: ["mvn", "-B", "spring-boot:run"]

  # Ambiente de build do frontend.
  # Uso: docker compose run --rm frontend npm run build
  frontend:
    image: node:22-alpine
    container_name: republicas-frontend
    working_dir: /workspace/frontend
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./:/workspace
      - node-modules:/workspace/frontend/node_modules
    command: ["npm", "run", "build"]

volumes:
  pgdata:
  maven-repo:
  node-modules:
