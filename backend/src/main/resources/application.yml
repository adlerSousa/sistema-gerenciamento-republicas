spring:

  application:
    name: sistema-gerenciamento-republicas

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/republicas}
    username: ${SPRING_DATASOURCE_USERNAME:republicas}
    password: ${SPRING_DATASOURCE_PASSWORD:republicas}

  jpa:
    # O esquema e gerenciado exclusivamente pelas migracoes Flyway.
    # O Hibernate apenas valida o mapeamento contra o esquema existente.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: INFO
    br.ufes.republicas: INFO

# Configuracoes de negocio do sistema.
republicas:
  notificacao:
    # BR01.1 - prazo padrao de aviso de lancamentos com vencimento proximo.
    prazo-aviso-vencimento-dias-padrao: 5
  log:
    # Formato do arquivo de registro de operacoes (RF09): CSV, JSON ou XML.
    formato: CSV
    diretorio: ${REPUBLICAS_LOG_DIR:./logs}
